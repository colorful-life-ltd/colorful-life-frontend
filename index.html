<!doctype html>
<html lang="en-GB">

    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e6ddf1" />

    <meta property="og:site_name" content="Build &amp; Bloom" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:title" content="Build &amp; Bloom | LEGO® Sets with UK Delivery" />
    <meta property="og:description" content="A UK seller of new LEGO® sets, with UK delivery and clear delivery and returns information." />

    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" href="/favicon-16x16.png" sizes="16x16" />
    <link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32" />

  </head>

    <script type="module" src="/src/main.tsx"></script>

</html>
