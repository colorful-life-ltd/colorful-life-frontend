name: Production storefront (manual)
on:
  workflow_dispatch:
    inputs:
      action:
        description: Production action
        type: choice
        options: [deploy, rollback, recover]
        required: true
      route_digest:
        description: Verified Production nginx configuration SHA256
        required: true
      backend_revision:
        description: Verified Production backend full revision
        required: true
      api_image:
        description: Verified Production API digest reference
        required: true
permissions:
  contents: read
concurrency:
  group: production-storefront
  cancel-in-progress: false
jobs:
  production:
    if: github.ref == 'refs/heads/main' && vars.PRODUCTION_STOREFRONT_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      ACTION: ${{ inputs.action }}
      ROUTE_DIGEST: ${{ inputs.route_digest }}
      BACKEND_REVISION: ${{ inputs.backend_revision }}
      API_IMAGE: ${{ inputs.api_image }}
      INFRA_REVISION: ${{ vars.PRODUCTION_STOREFRONT_INFRA_REVISION }}
      VITE_STRIPE_PUBLISHABLE_KEY: ${{ vars.PRODUCTION_STRIPE_PUBLISHABLE_KEY }}
      VITE_TARGET_ENVIRONMENT: production
      VITE_API_ENVIRONMENT: production
      VITE_API_BASE_URL: /api
      VITE_SITE_URL: https://build-and-bloom.co.uk
      VITE_PAYMENT_MODE: stripe-live
      VITE_REGISTRATION_ENABLED: 'false'
      VITE_SOURCE_REVISION: ${{ github.sha }}
      AWS_REGION: eu-west-2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Validate release inputs
        run: |
          [[ "$ROUTE_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          [[ "$BACKEND_REVISION" =~ ^[a-f0-9]{40}$ ]]
          [[ "$API_IMAGE" =~ ^919693204623\.dkr\.ecr\.eu-west-2\.amazonaws\.com/colorful-life-production-api@sha256:[a-f0-9]{64}$ ]]
          if [[ "$ACTION" = deploy ]]; then
            [[ "$INFRA_REVISION" =~ ^[a-f0-9]{40}$ ]]
            [[ "$VITE_STRIPE_PUBLISHABLE_KEY" =~ ^pk_live_[A-Za-z0-9]{8,}$ ]]
          fi
      - name: Verify and build Production artifact
        if: inputs.action == 'deploy'
        run: |
          npm ci
          npm run test:contracts
          npx tsc -b --noEmit
          npm run lint
          npm run test:run
          npm run legal:check
          npm run build
          python3 -c 'import hashlib,os,sys; from pathlib import Path; sys.path.insert(0,"scripts"); import production_artifact as a; k=os.environ["VITE_STRIPE_PUBLISHABLE_KEY"]; print("RELEASE_SHA256="+a.pack(Path("dist"),Path("storefront.tar.gz"),os.environ["GITHUB_SHA"],hashlib.sha256(k.encode()).hexdigest(),os.environ["INFRA_REVISION"]))' >> "$GITHUB_ENV"
          echo "KEY_FINGERPRINT=$(printf %s "$VITE_STRIPE_PUBLISHABLE_KEY" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: arn:aws:iam::919693204623:role/ColorfulLife-ProductionStorefrontDeploy
          role-session-name: production-storefront-${{ github.run_id }}
          aws-region: eu-west-2
      - name: Verify AWS account
        run: test "$(aws sts get-caller-identity --query Account --output text)" = 919693204623
      - name: Upload immutable release
        if: inputs.action == 'deploy'
        run: |
          aws s3api put-object --bucket colorful-life-production-storefront-919693204623 --key "storefront/${RELEASE_SHA256}.tar.gz" --body storefront.tar.gz --if-none-match '*' >/dev/null
          url=$(aws s3 presign "s3://colorful-life-production-storefront-919693204623/storefront/${RELEASE_SHA256}.tar.gz" --expires-in 300)
          echo "::add-mask::$url"
          echo "RELEASE_URL=$url" >> "$GITHUB_ENV"
      - name: Invoke fixed Production document
        run: |
          params=$(jq -nc --arg action "$ACTION" --arg url "${RELEASE_URL:-}" --arg digest "${RELEASE_SHA256:-}" --arg rev "${VITE_SOURCE_REVISION:-}" --arg fp "${KEY_FINGERPRINT:-}" --arg infra "$INFRA_REVISION" --arg route "$ROUTE_DIGEST" --arg backend "$BACKEND_REVISION" --arg image "$API_IMAGE" '{Action:[$action],Url:[$url],Digest:[$digest],Revision:[$rev],Fingerprint:[$fp],InfraRevision:[$infra],RouteDigest:[$route],BackendRevision:[$backend],ApiImage:[$image]}')
          id=$(aws ssm send-command --instance-ids i-02b28336518077a8f --document-name ColorfulLife-ProductionStorefrontDeploy --timeout-seconds 600 --parameters "$params" --query Command.CommandId --output text)
          for _ in $(seq 1 150); do
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id i-02b28336518077a8f --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) sleep 4 ;; Success) exit 0 ;; *) echo "Production action failed: $status"; exit 1 ;; esac
          done
          echo 'Production action did not finish'; exit 1
