name: Storefront integration
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      action:
        description: Sandbox storefront host action
        type: choice
        options: [deploy, rollback, status, nginx-install]
        default: deploy
      rollback_to:
        description: Optional 40-hex release SHA for rollback (default is the previous release)
        required: false
        default: ''
      nginx_site_sha256:
        description: Exact site.conf SHA-256 returned by status; required for nginx-install
        required: false
        default: ''
      nginx_approved:
        description: Explicit owner approval for the reviewed Build & Bloom Nginx SEO change
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    # Rollback/status must work even when main is broken, so they skip verification.
    if: github.event_name != 'workflow_dispatch' || inputs.action == 'deploy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:contracts
      - run: npx tsc -b --noEmit
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build
      - run: npm run legal:check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: colorful-life-storefront
          path: dist/
          if-no-files-found: error

  # Push-to-Sandbox delivery. Deploy, rollback and Nginx change stay inert until the owner sets repository variable
  # SANDBOX_DEPLOY_ENABLED=true; the read-only `status` dispatch is always allowed from main.
  # Only main can assume the deploy role (OIDC subject is pinned in colorful-life-infra), and the role can
  # run only the ColorfulLife-DeployStorefront SSM document. There is no production target here.
  deploy-sandbox:
    needs: verify
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && (
        (github.event_name == 'workflow_dispatch' && inputs.action == 'status') ||
        (github.event_name == 'workflow_dispatch' && inputs.action == 'nginx-install' && vars.SANDBOX_DEPLOY_ENABLED == 'true' && inputs.nginx_approved) ||
        (vars.SANDBOX_DEPLOY_ENABLED == 'true' && (
          (github.event_name == 'push' && needs.verify.result == 'success') ||
          (github.event_name == 'workflow_dispatch' && inputs.action == 'deploy' && needs.verify.result == 'success') ||
          (github.event_name == 'workflow_dispatch' && inputs.action == 'rollback' && needs.verify.result == 'skipped'))))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: sandbox-storefront
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: eu-west-2
      RELEASE_BUCKET: colorful-life-sandbox-releases-919693204623
      INSTANCE_ID: i-02b28336518077a8f
      DEPLOY_DOCUMENT: ColorfulLife-DeployStorefront
      ACTION: ${{ github.event_name == 'workflow_dispatch' && inputs.action || 'deploy' }}
      ROLLBACK_TO: ${{ inputs.rollback_to }}
      NGINX_SITE_SHA256: ${{ inputs.nginx_site_sha256 }}
      NGINX_APPROVED: ${{ inputs.nginx_approved && 'true' || 'false' }}
    steps:
      # Deploys run one at a time but in the order their verify jobs finish, not commit order. A push deploy that
      # starts after main has moved on would replace a newer release with an older one, so skip it (fail closed).
      - name: Skip a superseded push deploy
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github.sha" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/commits/main")
          [[ "$head" =~ ^[0-9a-f]{40}$ ]] || { echo "Could not read the current main SHA"; exit 1; }
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::Skipping deploy of ${GITHUB_SHA::12}: main is now ${head::12}, which deploys in its own run."
            echo "SUPERSEDED=true" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: env.ACTION == 'deploy' && env.SUPERSEDED != 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: env.ACTION == 'deploy' && env.SUPERSEDED != 'true'
        with:
          node-version: 24
          cache: npm
      - name: Build and check the Sandbox release
        if: env.ACTION == 'deploy' && env.SUPERSEDED != 'true'
        env:
          VITE_API_BASE_URL: /api
          VITE_SITE_URL: https://build-and-bloom.co.uk
          VITE_PAYMENT_MODE: ${{ vars.SANDBOX_PAYMENT_MODE || 'paypal-sandbox' }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ vars.SANDBOX_PAYMENT_MODE == 'stripe-sandbox' && vars.VITE_STRIPE_TEST_PUBLISHABLE_KEY || '' }}
          VITE_SANDBOX_REGISTRATION_ENABLED: 'true'
          VITE_PAYPAL_SANDBOX_CLIENT_ID: ${{ vars.VITE_PAYPAL_SANDBOX_CLIENT_ID }}
        run: |
          npm ci
          npm run legal:check
          npm run build
          node scripts/check-sandbox-bundle.mjs dist
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -C dist -cf - . | gzip -n > storefront.tar.gz
          echo "RELEASE_SHA256=$(sha256sum storefront.tar.gz | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        if: env.SUPERSEDED != 'true'
        with:
          role-to-assume: arn:aws:iam::919693204623:role/ColorfulLife-SandboxStorefrontDeploy
          role-session-name: storefront-${{ github.run_id }}
          aws-region: eu-west-2
      # The pinned credentials action predates allowed-account-ids, so check the account explicitly.
      - name: Confirm the Colorful Life AWS account
        if: env.SUPERSEDED != 'true'
        run: test "$(aws sts get-caller-identity --query Account --output text)" = 919693204623
      - name: Upload release archive
        if: env.ACTION == 'deploy' && env.SUPERSEDED != 'true'
        run: |
          key="storefront/${GITHUB_SHA}.tar.gz"
          aws s3 cp storefront.tar.gz "s3://${RELEASE_BUCKET}/${key}" --only-show-errors
          url=$(aws s3 presign "s3://${RELEASE_BUCKET}/${key}" --expires-in 300)
          echo "::add-mask::${url}"
          echo "RELEASE_URL=${url}" >> "$GITHUB_ENV"
      - name: Run the host action through SSM and wait for its result
        if: env.SUPERSEDED != 'true'
        run: |
          sha=""
          if [ "$ACTION" = deploy ]; then sha="$GITHUB_SHA"; fi
          if [ "$ACTION" = rollback ] && [ -n "$ROLLBACK_TO" ]; then
            [[ "$ROLLBACK_TO" =~ ^[0-9a-f]{40}$ ]] || { echo "rollback_to must be a 40-hex SHA"; exit 1; }
            sha="$ROLLBACK_TO"
          fi
          params=$(jq -nc --arg a "$ACTION" --arg u "${RELEASE_URL:-}" --arg h "${RELEASE_SHA256:-}" --arg s "$sha" --arg nsh "$NGINX_SITE_SHA256" --arg na "$NGINX_APPROVED" \
            '{Action:[$a],Url:[$u],Sha256:[$h],Sha:[$s],SiteSha256:[$nsh],NginxApproved:[$na]}')
          id=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name "$DEPLOY_DOCUMENT" \
            --comment "storefront ${ACTION} ${GITHUB_SHA::12} run ${GITHUB_RUN_ID}" --timeout-seconds 600 \
            --parameters "$params" --query Command.CommandId --output text)
          status=Pending
          for _ in $(seq 1 150); do
            sleep 4
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done
          output=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text 2>/dev/null || true)
          echo "$output"
          {
            echo "### Sandbox Storefront ${ACTION}: ${status}"
            echo "- Commit: \`${GITHUB_SHA}\`"
            [ -z "${RELEASE_SHA256:-}" ] || echo "- Archive sha256: \`${RELEASE_SHA256}\`"
            echo "- SSM command: \`${id}\`"
            echo '```'; echo "$output"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          test "$status" = Success
